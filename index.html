<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .subtext {
      color: #9ca3af;
      margin-bottom: 2.5rem;
    }
    .progress-bar {
      width: 100%;
      height: 30px;
      background: #374151;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      width: 0%;
      border-radius: 15px;
      transition: width 0.3s ease;
    }
    .status {
      font-family: monospace;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      text-align: left;
      background: #1f2937;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #374151;
      min-height: 100px;
    }
    .percentage {
      font-size: 2.5rem;
      font-weight: bold;
      color: #60a5fa;
      margin-bottom: 0.5rem;
    }
    .file-info {
      color: #6b7280;
      font-size: 0.85rem;
    }
    .hidden-message {
      display: none;
      margin-top: 2rem;
      padding: 1.5rem;
      background: #374151;
      border-radius: 8px;
      border: 2px solid #f59e0b;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">📂</div>
    <h1>Downloading File...</h1>
    <p class="subtext">Please wait — do not close this window</p>
    
    <div class="percentage" id="percent">0%</div>
    <div class="progress-bar">
      <div class="progress-fill" id="bar"></div>
    </div>
    
    <div class="status" id="status">
      Initializing download...<br>
      Connecting to server...
    </div>
    
    <p class="file-info" id="fileInfo">File: secret_file.zip • Size: 2.4 GB</p>
    
    <div class="hidden-message" id="message">
      <h2>😆 GOTCHA!</h2>
      <p>There was never anything to download! You've been pranked by <strong>BadMonki</strong> 🐵</p>
      <p style="margin-top: 1rem; font-size: 0.9rem; color: #9ca3af;">You can close this page now — nothing was downloaded. 😉</p>
    </div>
  </div>

  <script>
    let percent = 0;
    const bar = document.getElementById('bar');
    const percentText = document.getElementById('percent');
    const statusBox = document.getElementById('status');
    const fileInfo = document.getElementById('fileInfo');
    const message = document.getElementById('message');
    
    const statusMessages = [
      'Initializing download...<br>Connecting to server...',
      'Connected! Starting transfer...',
      'Downloading: secret_file.zip',
      'Checking file integrity...',
      'Still working...',
      'Almost there...',
      'Verifying checksum...',
      'Connecting to backup server...',
      'Recalculating...',
      'Finalizing...'
    ];
    
    // Random delays to make it look real
    function getRandomDelay() {
      return Math.random() * 2000 + 500;
    }
    
    function updateProgress() {
      if (percent < 98) {
        // Slow down as it gets closer to 100%
        if (percent > 85) {
          percent += Math.random() * 0.5 + 0.1;
        } else if (percent > 70) {
          percent += Math.random() * 1 + 0.2;
        } else {
          percent += Math.random() * 3 + 0.5;
        }
        
        percent = Math.min(percent, 98);
        percentText.textContent = percent.toFixed(1) + '%';
        bar.style.width = percent + '%';
        
        // Update status message occasionally
        if (Math.random() > 0.7) {
          const randomMsg = statusMessages[Math.floor(Math.random() * statusMessages.length)];
          statusBox.innerHTML = randomMsg;
        }
        
        setTimeout(updateProgress, getRandomDelay());
      } else {
        // Stuck at 98% forever... 😆
        percentText.textContent = '98%';
        bar.style.width = '98%';
        statusBox.innerHTML = 'Almost done...<br>Cleaning up...<br>Just a little longer...';
        fileInfo.innerHTML = 'File: secret_file.zip • Size: 2.4 GB • Time remaining: Calculating...';
        
        // After a long wait — reveal the joke!
        setTimeout(() => {
          message.style.display = 'block';
          percentText.style.display = 'none';
          bar.style.display = 'none';
          statusBox.style.display = 'none';
          fileInfo.style.display = 'none';
          document.querySelector('h1').style.display = 'none';
          document.querySelector('.subtext').style.display = 'none';
          document.querySelector('.emoji').style.display = 'none';
        }, 15000); // 15 seconds — long enough to frustrate! 😆
      }
    }
    
    // Start the download
    setTimeout(updateProgress, 1000);
  </script>
</body>
</html>
